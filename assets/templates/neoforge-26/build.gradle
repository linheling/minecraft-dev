plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '{{moddevVersion}}'
    id 'idea'
}

version = "0.1.0"
group = "{{pkg}}"

java.toolchain.languageVersion = JavaLanguageVersion.of({{javaVersion}})

neoForge {
    version = project.neo_version
    // TODO: 26.x 官方 MDK 无映射配置块；如需自定义映射请参照 1.21 线模板自行添加。
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data { data() }
    }
    mods {
        "{{name}}" { sourceSet sourceSets.main }
    }
}

// 只展开 neoforge.mods.toml：expand 会求值资源里任何字面的 ${...}，白名单避免误伤。
processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand project.properties
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    // 1.20.1 路线：legacyforge 插件对 Forge 47.1.3 坐标开发（官方 MDK 现状，见方案 R6）。
    id 'net.neoforged.moddev.legacyforge' version '{{moddevVersion}}'
    id 'idea'
}

version = "0.1.0"
group = "{{pkg}}"

java.toolchain.languageVersion = JavaLanguageVersion.of({{javaVersion}})

legacyForge {
    version = "{{mcVersion}}-{{forgeVersion}}"
    parchment {
        mappingsVersion = "2023.09.03"
        minecraftVersion = "1.20.1"
    }
    runs {
        client { client() }
        server { server() }
        data { data() }
    }
    mods {
        "{{name}}" { sourceSet sourceSets.main }
    }
}

// 只展开元数据文件：processResources 的 expand 会把资源里任何字面的 ${...}
// 当作表达式求值，所以用一个显白名单，其它资源原样复制。
processResources {
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand project.properties
    }
}

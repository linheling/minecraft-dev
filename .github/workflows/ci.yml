name: CI

# The plugin has no runtime npm dependencies (peer-only, provided by the dsh
# host), so most jobs never install packages: they check out, set up Node, and
# run the scripts. The one exception is `plugin-load`, which installs the
# published peer packages to prove the entry points still import for real.
# Both shells matter: the test suite compares UTF-8 bytes, so a Windows
# checkout with CRLF would fail — .gitattributes pins eol=lf.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: syntax gate (node --check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run check:syntax
      - run: npm run check:unverified:gate
      # docs/STATE.md is the claim ledger for the 19 version lines: this fails
      # when it drifts from lib/versions.js or when a row loses its evidence.
      - run: npm run check:state

  test:
    name: tests (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # `node --test test/*.test.js`: cmd leaves the glob literal and Node 22+
      # expands it; bash expands it before Node sees it. Both work.
      - run: npm test
      - name: coverage floor
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run test:coverage

  plugin-load:
    name: plugin load (published peer packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # modules.test.js skips when the @deepseek-ai peer packages are absent, so
      # a broken entry-point export could pass every other job. Install the
      # published packages and run that file with the skip turned into a hard
      # failure. --no-save/--no-package-lock keep the checkout clean.
      # Do NOT add --legacy-peer-deps: npm 11 silently no-ops (`up to date,
      # audited 1 package`) against this package.json's multi-range
      # peerDependencies, and in save mode it crashes with
      # "Cannot read properties of undefined (reading 'spec')". A plain install
      # resolves the tree correctly and is what users run.
      - name: install peer packages
        run: >
          npm install --no-save --no-package-lock
          @deepseek-ai/cordis@4.0.5
          @deepseek-ai/dsh-tools@0.2.1-rc.2
          @deepseek-ai/dsh-skill@0.2.1-rc.2
          @deepseek-ai/schemastery@3.18.5
      # tools-schema.test.js actually calls `apply()`, which is where defineTool
      # compiles every output schema. Importing the entry points alone cannot see
      # a schema the compiler rejects: v0.16.0 shipped mc_port_audit with object
      # nodes missing `additionalProperties`, and the whole minecraft-tools row
      # failed to activate in the harness while every job here stayed green.
      - run: REQUIRE_PLUGIN_DEPS=1 node --test test/modules.test.js test/tools-schema.test.js test/tool-components.test.js test/smoke.test.js test/state-doc.test.js test/codex-architect.test.js
      # The checkout-based import above cannot catch a package that forgets a
      # directory in package.json.files. Pack the real tarball, unpack it, assert
      # the bundled assets/preset files are present, then import all four entry
      # points from the unpacked package (peer packages resolve from the
      # checkout's node_modules).
      - name: pack the plugin
        run: npm pack --json > /tmp/minecraft-dev-pack.json
      - name: load the packed tarball
        run: |
          TARBALL=$(node -p "require('/tmp/minecraft-dev-pack.json')[0].filename")
          rm -rf .pack-test
          mkdir -p .pack-test
          tar -xzf "$TARBALL" -C .pack-test
          REQUIRE_PLUGIN_DEPS=1 node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          import { pathToFileURL } from 'node:url'
          const root = `${process.cwd()}/.pack-test/package`
          const required = [
            'skills.js', 'tools.js', 'preset.js', 'codex.js',
            'cordis.patch.yml', 'lib/scaffold.js',
            'assets/skills/minecraft-paper-plugin/SKILL.md',
            'preset/minecraft/preset.yml',
            'preset/minecraft/agent.cordis.yml',
          ]
          for (const rel of required) {
            if (!fs.existsSync(`${root}/${rel}`)) throw new Error(`packed tarball is missing ${rel}`)
          }
          for (const entry of ['skills.js', 'tools.js', 'preset.js', 'codex.js']) {
            await import(pathToFileURL(`${root}/${entry}`).href)
            console.log(`loaded ${entry}`)
          }
          // Register the tools from the PACKED copy: defineTool compiles the
          // output schemas here, so a shipped tarball with an unsupported schema
          // fails the job instead of failing activation on a user's machine.
          const toolsEntry = await import(pathToFileURL(`${root}/tools.js`).href)
          const registered = []
          toolsEntry.apply(
            { tools: { register: (definition) => registered.push(definition) } },
            { gradleTimeoutMs: 600_000, outputTailChars: 12_000 },
          )
          const names = registered.map((definition) => definition.name)
          if (names.join(',') !== 'mc_scaffold,mc_gradle,mc_port_audit') {
            throw new Error(`packed tools.js registered ${JSON.stringify(names)}`)
          }
          console.log(`registered ${names.join(', ')}`)
          NODE
      - name: clean pack artifacts
        if: always()
        run: rm -rf .pack-test minecraft-dev-*.tgz /tmp/minecraft-dev-pack.json
